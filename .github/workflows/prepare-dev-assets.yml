name: Prepare dev lockfile and icons
on:
  push:
    branches: [feat/exam-flashcards-fsrs-20261029]
    paths: [.github/workflows/prepare-dev-assets.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Build app icons
        run: |
          python -m pip install --quiet pillow
          python scripts/build_icons.py
      - name: Commit artifacts to development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json public/icon-192.png public/icon-512.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: sync lockfile and PWA icons"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
