name: Validate exam flashcards
on:
  push:
    branches: [feat/exam-flashcards-fsrs-20261029]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --package-lock=false
      - name: Type check and bundle
        run: npm run build
      - name: Lint
        run: npm run lint
