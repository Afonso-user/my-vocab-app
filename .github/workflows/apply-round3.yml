name: Apply V3 verified development patch
on:
  push:
    branches: [feat/exam-flashcards-fsrs-20261029]
    paths: [.github/workflows/apply-round3.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Decode development patch
        run: |
          python -m pip install --quiet brotli
          python - <<'PY'
          from pathlib import Path
          import base64, brotli, hashlib
          b = base64.b64decode(Path("scripts/round3-patch.br.b64").read_text().strip())
          raw = brotli.decompress(b)
          checksum = hashlib.sha256(raw).hexdigest()
          expected = "e0c012b0b064445df572c4c957f5dca155958e25ddc0348afd2e61ef4f9c279a"
          assert checksum == expected, f"Patch digest mismatch: {checksum}"
          Path("/tmp/round3.patch").write_bytes(raw)
          PY
      - name: Apply V3 patch safely
        run: |
          git apply --check /tmp/round3.patch
          git apply /tmp/round3.patch
          git checkout -- .github/workflows/browser-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts/browser_fast_import.mjs
          git commit -m "feat: V3 fast import, smart mapping, cached FSRS and refined UI"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
